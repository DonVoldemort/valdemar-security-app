trigger:
  branches:
    include:
      - master

variables:
  azureSubscription: 'valdemar-devops-conn'
  acrName: 'valdemarregistry'
  acrLoginServer: 'valdemarregistry.azurecr.io'
  imageName: 'valdemar-security-app'
  aksResourceGroup: 'webPRD'
  aksClusterName: 'valdemar-aks'
  namespace: 'default'

stages:

  - stage: BuildAndPush
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build and push Docker image
            inputs:
              command: buildAndPush
              repository: $(acrLoginServer)/$(imageName)
              dockerfile: Dockerfile
              tags: |
                latest

          - task: AzureCLI@2
            displayName: 'Login to AKS'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials --resource-group $(aksResourceGroup) --name $(aksClusterName) --overwrite-existing

          - task: KubernetesManifest@1
            displayName: Deploy to AKS
            inputs:
              action: deploy
              kubernetesServiceConnection: $(azureSubscription)
              namespace: $(namespace)
              manifests: |
                deployment.yaml
                service.yaml
              containers: |
                $(acrLoginServer)/$(imageName):latest
